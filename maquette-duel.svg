<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="856" viewBox="0 0 1280 856" font-family="Segoe UI, Arial, sans-serif">
  <!-- Fond de l'écran (1280x856 : tout tient sans défilement) -->
  <rect width="1280" height="856" fill="#eef0f4"/>

  <!-- En-tête -->
  <rect x="0" y="0" width="1280" height="56" fill="#1f2329"/>
  <text x="24" y="36" fill="#ffffff" font-size="20" font-weight="700">Top Trump — Duel sur la même machine</text>
  <text x="1256" y="34" fill="#9aa3b2" font-size="12" text-anchor="end">Maquette · écran 1280×856 · tout visible sans défilement</text>

  <!-- Colonne gauche : mains + historique -->
  <rect x="16" y="72" width="392" height="752" rx="10" fill="#ffffff" stroke="#c8ced8"/>

  <!-- Main de l'adversaire (masquée) -->
  <text x="32" y="100" fill="#5b6472" font-size="12" font-weight="700" letter-spacing="1.5">MAIN DE L'ADVERSAIRE</text>
  <text x="32" y="116" fill="#9aa3b2" font-size="11" font-style="italic">face cachée — pas de nom, pas de rareté</text>
  <g stroke="#8a93a3" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="32" y="128" width="80" height="112" rx="6" fill="#e3e7ee"/>
    <rect x="120" y="128" width="80" height="112" rx="6" fill="#e3e7ee"/>
    <rect x="208" y="128" width="80" height="112" rx="6" fill="#e3e7ee"/>
    <rect x="296" y="128" width="80" height="112" rx="6" fill="#e3e7ee"/>
  </g>
  <g fill="#8a93a3" font-size="28" text-anchor="middle">
    <text x="72" y="191">?</text>
    <text x="160" y="191">?</text>
    <text x="248" y="191">?</text>
    <text x="336" y="191">?</text>
  </g>

  <line x1="32" y1="262" x2="376" y2="262" stroke="#e3e7ee"/>

  <!-- Main du joueur (visible) -->
  <text x="32" y="282" fill="#5b6472" font-size="12" font-weight="700" letter-spacing="1.5">MAIN DU JOUEUR</text>
  <text x="32" y="298" fill="#9aa3b2" font-size="11" font-style="italic">nom et rareté visibles</text>
  <g stroke="#b7c0cc" stroke-width="1.5">
    <rect x="32" y="310" width="80" height="112" rx="6" fill="#ffffff"/>
    <rect x="120" y="310" width="80" height="112" rx="6" fill="#ffffff"/>
    <rect x="208" y="310" width="80" height="112" rx="6" fill="#ffffff"/>
    <rect x="296" y="310" width="80" height="112" rx="6" fill="#ffffff"/>
  </g>
  <g fill="#3b4351" font-size="9" text-anchor="middle">
    <text x="72" y="331">Kraken</text>
    <text x="160" y="331">Liche</text>
    <text x="248" y="331">Golem</text>
    <text x="336" y="331">Tarrasque</text>
  </g>
  <!-- Barres de rareté sous chaque carte du joueur -->
  <rect x="32" y="408" width="80" height="8" rx="3" fill="#ff9f2e"/>
  <rect x="120" y="408" width="80" height="8" rx="3" fill="#b06cf5"/>
  <rect x="208" y="408" width="80" height="8" rx="3" fill="#4aa3ff"/>
  <rect x="296" y="408" width="80" height="8" rx="3" fill="#94a7c4"/>

  <line x1="32" y1="440" x2="376" y2="440" stroke="#e3e7ee"/>

  <!-- Historique, sous les mains -->
  <text x="32" y="460" fill="#5b6472" font-size="12" font-weight="700" letter-spacing="1.5">HISTORIQUE</text>
  <text x="32" y="476" fill="#9aa3b2" font-size="11" font-style="italic">en dessous de la main des joueurs</text>
  <rect x="32" y="488" width="344" height="320" rx="8" fill="#f6f8fb" stroke="#e3e7ee"/>
  <g fill="#5b6472" font-size="11.5">
    <circle cx="46" cy="508" r="3"/>
    <text x="58" y="512">1. Joueur gagne — Vitesse 87 contre 72</text>
    <circle cx="46" cy="544" r="3"/>
    <text x="58" y="548">2. Adversaire gagne — Magie 64 contre 55</text>
    <circle cx="46" cy="580" r="3"/>
    <text x="58" y="584">3. Égalité — mise commune (2 cartes)</text>
    <circle cx="46" cy="616" r="3"/>
    <text x="58" y="620">4. Joueur déclenche « Contre-offensive »</text>
    <circle cx="46" cy="652" r="3"/>
    <text x="58" y="656">5. Adversaire gagne — Endurance 90 contre 71</text>
    <circle cx="46" cy="688" r="3"/>
    <text x="58" y="692">6. Événement « Sort retourné »</text>
    <circle cx="46" cy="724" r="3"/>
    <text x="58" y="728">7. Joueur gagne — Force 96 contre 83</text>
    <circle cx="46" cy="760" r="3"/>
    <text x="58" y="764">8. Égalité — mise détruite (3 tours)</text>
  </g>

  <!-- Zone de jeu (droite) -->
  <rect x="424" y="72" width="840" height="752" rx="10" fill="#f8f9fb" stroke="#c8ced8"/>
  <text x="440" y="96" fill="#9aa3b2" font-size="11" font-weight="700" letter-spacing="1.5">ZONE DE JEU (DROITE)</text>

  <!-- Points du joueur et de l'adversaire, tout en haut de la zone de jeu -->
  <text x="440" y="116" fill="#9aa3b2" font-size="10" font-weight="700" letter-spacing="1.5">POINTS</text>
  <rect x="440" y="124" width="392" height="46" rx="8" fill="#eef1f7" stroke="#d5dbe4"/>
  <text x="456" y="143" fill="#5b6472" font-size="12">Adversaire</text>
  <text x="456" y="161" fill="#3b4351" font-size="19" font-weight="700">12 pts</text>
  <rect x="844" y="124" width="392" height="46" rx="8" fill="#e8f2ff" stroke="#c7d9f3"/>
  <text x="860" y="143" fill="#1f6feb" font-size="12">Joueur</text>
  <text x="860" y="161" fill="#1f6feb" font-size="19" font-weight="700">18 pts</text>

  <line x1="440" y1="186" x2="1248" y2="186" stroke="#e3e7ee"/>

  <!-- À qui le tour -->
  <rect x="440" y="200" width="252" height="34" rx="17" fill="#ffffff" stroke="#c8ced8"/>
  <circle cx="460" cy="217" r="5" fill="#22c55e"/>
  <text x="474" y="223" fill="#3b4351" font-size="13">C'est au tour du Joueur</text>

  <!-- Choix de l'attribut à comparer -->
  <text x="440" y="256" fill="#9aa3b2" font-size="10" font-weight="700" letter-spacing="1.5">CHOIX DE L'ATTRIBUT À COMPARER</text>
  <rect x="440" y="268" width="153" height="40" rx="8" fill="#ffffff" stroke="#c8ced8"/>
  <text x="516" y="293" fill="#3b4351" font-size="14" text-anchor="middle">Force</text>
  <rect x="603" y="268" width="153" height="40" rx="8" fill="#1f6feb"/>
  <text x="679" y="293" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Vitesse</text>
  <rect x="766" y="268" width="153" height="40" rx="8" fill="#ffffff" stroke="#c8ced8"/>
  <text x="842" y="293" fill="#3b4351" font-size="14" text-anchor="middle">Intelligence</text>
  <rect x="929" y="268" width="153" height="40" rx="8" fill="#ffffff" stroke="#c8ced8"/>
  <text x="1005" y="293" fill="#3b4351" font-size="14" text-anchor="middle">Magie</text>
  <rect x="1092" y="268" width="153" height="40" rx="8" fill="#ffffff" stroke="#c8ced8"/>
  <text x="1168" y="293" fill="#3b4351" font-size="14" text-anchor="middle">Endurance</text>
  <text x="440" y="326" fill="#9aa3b2" font-size="11" font-style="italic">l'attribut choisi est mis en valeur (Vitesse)</text>

  <!-- Résultat du tour -->
  <rect x="440" y="338" width="808" height="38" rx="8" fill="#e8f7ee" stroke="#b9e6cc"/>
  <text x="456" y="363" fill="#166534" font-size="14">Résultat du tour : le Joueur remporte la comparaison (Vitesse 87 contre 72)</text>

  <line x1="440" y1="392" x2="1248" y2="392" stroke="#e3e7ee"/>

  <!-- Cartes jouées (le cœur de la zone de jeu) -->
  <text x="440" y="412" fill="#9aa3b2" font-size="10" font-weight="700" letter-spacing="1.5">CARTES JOUÉES (RÉVÉLÉES À LA COMPARAISON)</text>

  <!-- Carte jouée de l'adversaire -->
  <rect x="524" y="424" width="300" height="372" rx="10" fill="#ffffff" stroke="#c8ced8"/>
  <text x="542" y="450" fill="#1f2329" font-size="20" font-weight="700">Kraken Abyssal</text>
  <rect x="542" y="460" width="92" height="18" rx="9" fill="#ff9f2e"/>
  <text x="588" y="474" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Légendaire</text>
  <line x1="542" y1="490" x2="806" y2="490" stroke="#e3e7ee"/>
  <rect x="540" y="502" width="268" height="76" rx="6" fill="#2b2f38"/>
  <polygon points="674,516 716,556 674,596 632,556" fill="#ff9f2e" opacity="0.9"/>
  <g font-size="14">
    <text x="542" y="610" fill="#5b6472">Force</text>
    <text x="806" y="610" fill="#3b4351" font-weight="700" text-anchor="end">85</text>
    <text x="542" y="650" fill="#5b6472">Vitesse</text>
    <text x="806" y="650" fill="#1f6feb" font-weight="700" text-anchor="end">72</text>
    <text x="542" y="690" fill="#5b6472">Intelligence</text>
    <text x="806" y="690" fill="#3b4351" font-weight="700" text-anchor="end">68</text>
    <text x="542" y="730" fill="#5b6472">Magie</text>
    <text x="806" y="730" fill="#3b4351" font-weight="700" text-anchor="end">74</text>
    <text x="542" y="770" fill="#5b6472">Endurance</text>
    <text x="806" y="770" fill="#3b4351" font-weight="700" text-anchor="end">90</text>
  </g>

  <!-- Badge VS -->
  <circle cx="844" cy="610" r="28" fill="#1f2329"/>
  <text x="844" y="618" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">VS</text>

  <!-- Carte jouée du joueur -->
  <rect x="864" y="424" width="300" height="372" rx="10" fill="#ffffff" stroke="#c8ced8"/>
  <text x="882" y="450" fill="#1f2329" font-size="20" font-weight="700">Dragon Ancien</text>
  <rect x="882" y="460" width="92" height="18" rx="9" fill="#ff9f2e"/>
  <text x="928" y="474" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Légendaire</text>
  <line x1="882" y1="490" x2="1146" y2="490" stroke="#e3e7ee"/>
  <rect x="880" y="502" width="268" height="76" rx="6" fill="#2b2f38"/>
  <polygon points="1014,516 1056,556 1014,596 972,556" fill="#4a7fff" opacity="0.9"/>
  <g font-size="14">
    <text x="882" y="610" fill="#5b6472">Force</text>
    <text x="1146" y="610" fill="#3b4351" font-weight="700" text-anchor="end">96</text>
    <text x="882" y="650" fill="#5b6472">Vitesse</text>
    <text x="1146" y="650" fill="#1f6feb" font-weight="700" text-anchor="end">87</text>
    <text x="882" y="690" fill="#5b6472">Intelligence</text>
    <text x="1146" y="690" fill="#3b4351" font-weight="700" text-anchor="end">90</text>
    <text x="882" y="730" fill="#5b6472">Magie</text>
    <text x="1146" y="730" fill="#3b4351" font-weight="700" text-anchor="end">92</text>
    <text x="882" y="770" fill="#5b6472">Endurance</text>
    <text x="1146" y="770" fill="#3b4351" font-weight="700" text-anchor="end">95</text>
  </g>

  <!-- Légende sous la table -->
  <text x="844" y="814" fill="#9aa3b2" font-size="11" text-anchor="middle">les deux cartes jouées s'affichent ici, avec leur valeur comparée (Vitesse 87 contre 72)</text>

  <!-- Pied de la maquette -->
  <text x="640" y="846" fill="#6b7280" font-size="12" text-anchor="middle">Maquette de disposition — Duel · gauche : mains + historique · droite : points, tour, attributs, résultat, cartes jouées · rien ne déborde (pas de défilement)</text>
</svg>