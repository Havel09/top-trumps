<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La boutique - Top Trump Créatures Fantastiques</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-booster">

  <header class="entete entete--compact">
    <p class="entete__surtitre">Créatures Fantastiques</p>
    <h1 class="entete__titre">La boutique</h1>
    <p class="entete__baseline">
      Gagnez des pièces en jouant, puis ouvrez des boosters. Plus le booster
      est rare, plus les cartes tirées peuvent être fortes.
    </p>
    <div id="zone-solde"></div>
  </header>

  <main class="boutique">
    <p class="boutique__note">
      Chaque booster contient cinq cartes. Une carte déjà possédée est
      remboursée en pièces selon sa rareté.
    </p>

    <div id="boutique" class="grille-boosters" aria-live="polite"></div>

    <p id="message" class="boutique__message" role="status"></p>

    <section id="reveal" class="reveal" hidden>
      <h2 class="reveal__titre" id="reveal-titre"></h2>
      <p class="reveal__gain" id="reveal-gain"></p>
      <div id="reveal-cartes" class="reveal__cartes"></div>
    </section>
  </main>

  <nav class="retour-flot">
    <a class="bouton" href="galerie.html">Ma galerie</a>
    <a class="bouton" href="index.html">← Retour au menu</a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/portefeuille.js"></script>
  <script src="js/booster.js"></script>
</body>
</html>
