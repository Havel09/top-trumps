<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma galerie - Top Trump Créatures Fantastiques</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-collection">

  <header class="entete entete--compact">
    <p class="entete__surtitre">Créatures Fantastiques</p>
    <h1 class="entete__titre">Ma galerie</h1>
    <p class="entete__baseline" id="resume-galerie">
      <span id="nb-possedees">…</span> carte(s) sur <span id="nb-cartes">…</span>,
      complétude <span id="progression">…</span>.
    </p>
    <div id="zone-solde"></div>
  </header>

  <main class="collection">
    <p class="resume-raretes" id="resume-raretes" aria-label="Cartes possédées par rareté"></p>

    <div class="filtres" role="group" aria-label="Filtrer par rareté">
      <button type="button" class="filtre est-actif" data-rarete="toutes">Toutes</button>
    </div>

    <div id="grille" class="grille-cartes" aria-live="polite"></div>

    <p class="collection__note" id="note-galerie">
      Les cartes manquantes apparaissent en silhouette. Ouvrez des boosters
      pour les retrouver.
    </p>
  </main>

  <nav class="retour-flot">
    <a class="bouton" href="booster.html">Ouvrir des boosters</a>
    <a class="bouton" href="index.html">← Retour au menu</a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/regles.js"></script>
  <script src="js/portefeuille.js"></script>
  <script src="js/interface.js"></script>
  <script src="js/galerie.js"></script>
</body>
</html>
