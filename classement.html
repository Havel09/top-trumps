<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classement - Top Trump Créatures Fantastiques</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-classement">

  <header class="entete entete--compact">
    <p class="entete__surtitre">Créatures Fantastiques</p>
    <h1 class="entete__titre">Le classement</h1>
    <p class="entete__baseline" id="resume-classement">Chargement…</p>
  </header>

  <main class="classement-page">

    <section class="formulaire-joueur">
      <label for="nom-suivi">Ton nom de joueur</label>
      <input type="text" id="nom-suivi" maxlength="20" placeholder="Ex. Alix"
             autocomplete="nickname">
      <button type="button" id="btn-suivre" class="bouton">Suivre mes stats</button>
    </section>

    <section id="mes-stats" class="mes-stats" hidden></section>

    <section class="tableau-score">
      <table id="tableau-classement">
        <caption class="visuellement-cache">
          Classement des joueurs par score cumulé
        </caption>
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Joueur</th>
            <th scope="col">Score</th>
            <th scope="col">Victoires</th>
            <th scope="col">Parties</th>
            <th scope="col">Réussite</th>
            <th scope="col">Meilleure série</th>
            <th scope="col">Tours moyens</th>
          </tr>
        </thead>
        <tbody id="corps-classement"></tbody>
      </table>
    </section>

  </main>

  <nav class="retour-flot">
    <a class="bouton" href="index.html">← Retour au menu</a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/regles.js"></script>
  <script src="js/interface.js"></script>
  <script src="js/classement.js"></script>
</body>
</html>
